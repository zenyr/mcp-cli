pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md,yml,yaml}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      run: bun run lint
commit-msg:
  commands:
    conventional:
      run: bun scripts/check-commit-message.ts {1}
